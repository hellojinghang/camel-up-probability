<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardWise responsive test harness</title><style>body{margin:0;background:#dde3d8;font:14px system-ui;color:#244e43}header{display:flex;gap:12px;align-items:center;padding:16px;flex-wrap:wrap}button{padding:10px 16px;background:white;border:1px solid #bcc8b5;border-radius:7px;color:#244e43;cursor:pointer}iframe{display:block;border:1px solid #a8b89e;background:white;width:390px;height:820px;margin:0 auto 20px;max-width:100%;box-sizing:border-box}span{margin-left:auto}</style><header><strong>BoardWise · Responsive QA</strong><button data-width="390">Phone · 390 px</button><button data-width="768">Tablet · 768 px</button><button data-width="1280">Desktop · 1280 px</button><span id="size">390 px viewport</span></header><iframe title="BoardWise test viewport" src="../"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelector('#size').textContent=b.dataset.width+' px viewport';});</script></html>
